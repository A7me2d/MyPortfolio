<section class="resume-section">
  <div class="container">
    <div class="section-header" data-aos="fade-up">
      <h2 class="section-title">{{ t('resume.title') }}</h2>
      <p class="section-subtitle">{{ t('resume.subtitle') }}</p>
    </div>
    <div class="resume-frame-wrapper" data-aos="fade-up" data-aos-delay="200">
      <iframe [src]="resumeSafeUrl" class="resume-frame" title="Ahmed Hany Resume"
              loading="lazy" aria-label="Resume PDF viewer"></iframe>
    </div>
  </div>
</section>
